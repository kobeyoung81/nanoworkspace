<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="nanoworkspace: a verifier and forwarder between the console and the agent container">
  <title>nanoworkspace</title>
  <defs>
    <style>
      .txt { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; }
      .wire { stroke: #CBD5E1; stroke-width: 2; }
      .ink { fill: #0F172A; }
      .dim { fill: #64748B; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#FFFFFF"/>

  <rect x="400" y="30" width="160" height="36" rx="10" fill="#F1F5F9"/>
  <text class="txt" x="480" y="53" font-size="13" fill="#334155" text-anchor="middle">browser</text>

  <g class="wire">
    <line x1="480" y1="66" x2="480" y2="96"/>
  </g>

  <rect x="300" y="96" width="360" height="48" rx="10" class="card"/>
  <text class="txt ink" x="480" y="117" font-size="13" font-weight="600" text-anchor="middle">console nginx</text>
  <text class="mono dim" x="480" y="134" font-size="10" text-anchor="middle">/api/user/v1/ · /api/v1/workspace/</text>

  <g class="wire">
    <line x1="480" y1="144" x2="480" y2="176"/>
  </g>

  <rect x="240" y="176" width="480" height="90" rx="12" fill="#EEF2FF" stroke="#2F6BFF" stroke-width="2.5"/>
  <text class="txt ink" x="480" y="202" font-size="15" font-weight="700" text-anchor="middle">nanoworkspace</text>
  <text class="txt dim" x="480" y="221" font-size="11" text-anchor="middle">files · previews · git · the chat workbench</text>
  <text class="txt dim" x="480" y="241" font-size="10.5" text-anchor="middle">verifies the caller and forwards — it stores nothing</text>

  <g class="wire">
    <line x1="720" y1="200" x2="760" y2="200"/>
    <line x1="720" y1="250" x2="760" y2="250"/>
  </g>
  <rect x="760" y="180" width="170" height="40" rx="10" class="card"/>
  <text class="txt" x="845" y="205" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">nanoauth</text>
  <rect x="760" y="230" width="170" height="40" rx="10" class="card"/>
  <text class="txt" x="845" y="255" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">nanoportal</text>

  <g class="wire">
    <line x1="480" y1="266" x2="480" y2="296"/>
  </g>

  <rect x="300" y="296" width="360" height="44" rx="10" class="card"/>
  <text class="txt ink" x="480" y="316" font-size="13" font-weight="600" text-anchor="middle">nanoprovisioner</text>
  <text class="txt dim" x="480" y="332" font-size="10" text-anchor="middle">tunnels terminate here</text>

  <g class="wire">
    <line x1="480" y1="340" x2="480" y2="366"/>
  </g>

  <rect x="300" y="366" width="360" height="34" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="txt dim" x="480" y="388" font-size="11" text-anchor="middle">agent container · its volume</text>

  <text class="txt dim" x="480" y="414" font-size="10" text-anchor="middle">the bus keeps a tunnel fallback only for containers whose image predates the move</text>
</svg>
